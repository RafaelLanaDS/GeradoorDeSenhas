name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ./PasswordGenerator/PasswordGenerator

      - name: Build
        run: npm run build
        working-directory: ./PasswordGenerator/PasswordGenerator

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: "./PasswordGenerator/PasswordGenerator/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
